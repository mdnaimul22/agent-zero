<html>
<head>
  <script type="module">
    import { store } from "/plugins/_right-click/webui/right-click-store.js";
  </script>
</head>
<body>
  <div x-data
    @contextmenu.document="$store.rightClick.open($event)"
    @click.document.capture="$store.rightClick.closeOutside($event)"
    @scroll.window.capture="$store.rightClick.closeOutside($event)"
    @resize.window="$store.rightClick.close()"
    @keydown.window.capture="$store.rightClick.keydown($event)"
    x-effect="if ($store.rightClick.kind && !$store.rightClick.isOpen()) $store.rightClick.close()"
    x-destroy="$store.rightClick.close()"></div>
</body>
</html>
