<html>
<head>
  <script type="module">
    import { store } from "/plugins/_right-click/webui/right-click-store.js";
  </script>
</head>
<body>
  <div x-data x-show="$store.rightClick.kind === 'sidebar' && $store.sidebar.rowMenuKind === 'chat'">
    <div class="dropdown-separator"></div>
    <button type="button" class="dropdown-item" role="menuitem"
      :disabled="$store.fileBrowser.isLoading || $store.fileBrowser.isRenaming || $store.fileBrowser.isBulkBusy"
      @click="$store.rightClick.openChatFiles()">
      <x-icon name="folder_open"></x-icon>
      <span>Open in Files</span>
    </button>
    <button type="button" class="dropdown-item" role="menuitem"
      @click="$store.chats.saveChat($store.rightClick.chatId); $store.rightClick.close()">
      <x-icon name="download"></x-icon>
      <span>Save Chat</span>
    </button>
    <button type="button" class="dropdown-item" role="menuitem"
      @click="$store.chats.loadChats(); $store.rightClick.close()">
      <x-icon name="upload"></x-icon>
      <span>Load Chat</span>
    </button>
  </div>
</body>
</html>
