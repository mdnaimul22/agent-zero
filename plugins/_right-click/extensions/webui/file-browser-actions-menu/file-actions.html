<html>
<head>
  <script type="module">
    import { store } from "/plugins/_right-click/webui/right-click-store.js";
  </script>
</head>
<body>
  <div x-data x-show="$store.rightClick.kind === 'file' && ($store.fileBrowser.remoteAllowed(file.is_dir ? 'browse' : 'download', file) || $store.fileBrowser.remoteAllowed('delete', file))">
    <div class="dropdown-separator"></div>
    <button type="button" class="dropdown-item"
      x-show="file.is_dir && $store.fileBrowser.remoteAllowed('browse', file)"
      @click="$store.fileBrowser.navigateToFolder(file.path)">
      <x-icon name="folder_open"></x-icon>
      <span>Open</span>
    </button>
    <button type="button" class="dropdown-item"
      x-show="!file.is_dir && $store.fileBrowser.remoteAllowed('download', file)"
      @click="$store.fileBrowser.downloadFile(file)">
      <x-icon name="download"></x-icon>
      <span>Download</span>
    </button>
    <button type="button" class="dropdown-item"
      x-show="$store.fileBrowser.remoteAllowed('delete', file)"
      @click.stop="$confirmClick($event, () => { $store.fileBrowser.deleteFile(file); $store.rightClick.close(); })">
      <x-icon name="delete"></x-icon>
      <span>Delete</span>
    </button>
  </div>
</body>
</html>
